name: Migrations em produção

# Aplica supabase/migrations no banco de produção sempre que uma migration nova entra na main.
# Precisa de dois segredos no GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal do Supabase (Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   senha do banco do projeto

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: migrations-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: djmtzvsjfbxuibbaqdjp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do banco (nada vai para produção sem passar)
        run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Conectar ao projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migrations pendentes
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
