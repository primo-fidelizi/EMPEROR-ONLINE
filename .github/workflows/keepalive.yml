name: Keepalive

# O Supabase Free pausa projetos sem atividade por ~7 dias.
# Um ping diário na rota de health (que lê o banco) mantém tudo acordado.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: curl --fail --silent --show-error --max-time 30 https://emperor-online.vercel.app/api/health
